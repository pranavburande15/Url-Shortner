<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">🔗 URL Shortener</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="url" name="long_url" class="form-control" placeholder="https://example.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Short Link</button>
            </form>
            {% if short_url_obj %}
                <div class="alert alert-success mt-4">
                    <p class="mb-1">Short Link ready</p>
                    <a href="http://127.0.0.1:8000/{{ short_url_obj.short_code }}" target="_blank" class="fw-bold text-break">
                        http://127.0.0.1:8000/{{ short_url_obj.short_code }}
                    </a>
                    <br>
                    <a href="{% url 'update_url' short_url_obj.id %}" class="btn btn-sm btn-warning mt-3">Update</a>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
