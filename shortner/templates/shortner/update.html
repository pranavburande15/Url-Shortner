<!DOCTYPE html>
<html>
<head>
    <title>Update URL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">✏️ URL Update</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="url" name="long_url" value="{{ url_obj.long_url }}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Update Save</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'home' %}" class="text-decoration-none">Home</a>
            </div>
        </div>
    </div>
</body>
</html>
